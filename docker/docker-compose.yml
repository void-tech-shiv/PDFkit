version: '3.8'

services:
  pdfkit:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: pdfkit-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MAX_FILE_SIZE_MB=100
      - TEMP_FILE_TTL_MINUTES=15
    volumes:
      - pdfkit-temp:/app/temp

volumes:
  pdfkit-temp:
