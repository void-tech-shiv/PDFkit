name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "Please search existing issues first. Do not include private documents or personal information."
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user need or workflow is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
